[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  # REACT_APP_* values are public client-side config embedded in the bundle by design.
  SECRETS_SCAN_OMIT_KEYS = "REACT_APP_FIREBASE_PROJECT_ID,REACT_APP_FIREBASE_API_KEY,REACT_APP_FIREBASE_APP_ID,REACT_APP_FIREBASE_AUTH_DOMAIN,REACT_APP_FIREBASE_MESSAGING_SENDER_ID,REACT_APP_FIREBASE_STORAGE_BUCKET,REACT_APP_CLOUDINARY_CLOUD_NAME,REACT_APP_CLOUDINARY_UPLOAD_PRESET"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  targetPort = 5000
  port = 8888

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200